plugins {
	id 'java-library'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'maven-publish'
}

group = 'kr.suhsaechan'
version = '2.0.0'
description = 'SUH-AIDER'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
	withSourcesJar()
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-configuration-processor'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// OkHttp
	api 'com.squareup.okhttp3:okhttp:4.12.0'
	implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

	// Jackson (JSON 처리)
	api 'com.fasterxml.jackson.core:jackson-databind'
	api 'com.fasterxml.jackson.core:jackson-annotations'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// 기본 test 태스크는 네트워크가 필요 없는 유닛 테스트만 실행한다.
// 실서버에 의존하는 테스트가 섞여 있으면 CI 결과를 신뢰할 수 없다.
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'integration'
	}
}

// 실서버 대상 통합 테스트: ./gradlew integrationTest
// SUH_AIDER_IT=true 환경변수가 있어야 개별 테스트가 실제로 동작한다.
tasks.register('integrationTest', Test) {
	description = '실제 AI 서버를 대상으로 하는 통합 테스트'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'integration'
	}
	shouldRunAfter tasks.named('test')
}

bootJar { enabled = false }
jar { enabled = true }

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
			pom {
				name = 'suh-aider'
				description = '서새찬 AI 서버 통신 라이브러리'
				url = 'https://github.com/Cassiiopeia/suh-aider/'
			}
		}
	}
	repositories {
		mavenLocal()
		maven {
			name = 'nexus'
			url = uri(
					version.endsWith('SNAPSHOT')
							? "https://nexus.suhsaechan.kr/repository/maven-snapshots/"
							: "https://nexus.suhsaechan.kr/repository/maven-releases/"
			)
			allowInsecureProtocol = true
			credentials {
				username = project.findProperty('nexusUsername')
				password = project.findProperty('nexusPassword')
			}
		}
	}
}